# QUASAR — локальные сервисы для разработки (см. .cursor/rules/quasar-context.mdc).
# Секреты и учётные данные БД — только из переменных окружения (файл .env в корне репозитория
# рядом с этим файлом, либо экспорт в оболочке). Значения по умолчанию согласованы с backend/.env.example.
#
# Запуск из корня: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: quasar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quasar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quasar}
      POSTGRES_DB: ${POSTGRES_DB:-quasar}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - quasar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quasar} -d ${POSTGRES_DB:-quasar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quasar-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - quasar_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  quasar_postgres_data:
  quasar_redis_data:
